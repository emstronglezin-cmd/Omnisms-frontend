name: omnisms
description: OmniSMS - Application de messagerie complète
publish_to: 'none'
version: 2.2.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.4.4
  
  # State Management
  provider: ^6.1.2
  
  # Network
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.0.5
  
  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  
  # Audio
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  record: ^5.1.0
  
  # Contacts
  flutter_contacts: ^1.1.7+1
  
  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.4.0
  url_launcher: ^6.3.1
  flutter_emoji: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
