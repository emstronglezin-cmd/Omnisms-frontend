name: omnisms
description: OmniSMS - Application de messagerie SMS complète
publish_to: 'none'
version: 2.5.0+1

# Version de référence du projet : Flutter 3.47.7 (canal stable) / Dart 3.13.5.
# Toute la branche 3.47.x convient ; les versions antérieures ne sont plus
# supportées (API DialogThemeData, flutter_contacts >= 2.6).
environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Network
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Storage
  shared_preferences: ^2.3.2

  # Audio (web-compatible)
  just_audio: ^0.9.36

  # Audio recording (mobile)
  record: ^5.1.2

  # Répertoire temporaire pour les fichiers audio (messages vocaux)
  path_provider: ^2.1.5

  # Permission handling (Android runtime + iOS)
  permission_handler: ^11.3.1

  # Performance & Cache
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1

  # Photo de profil / photo de groupe (compressée 400×400, qualité 75 —
  # équivalent de compressImageForAvatar() côté PWA)
  image_picker: ^1.1.7

  # Carnet d'adresses natif du téléphone (Android/iOS).
  # Remplace le stub ContactsService.getPhoneContacts() qui renvoyait [].
  flutter_contacts: ^2.6.0

  # Deep links — retour OAuth Google imposé par le backend
  # (omnisms://auth/google/callback et omnisms://auth/google/contacts/callback)
  # https://pub.dev/packages/app_links
  app_links: ^6.3.2

  # Advertising — Start.io (Android only, gated by premium status)
  # https://pub.dev/packages/startapp_sdk
  startapp_sdk: ^1.0.1
  socket_io_client: ^3.1.6
  flutter_svg: ^2.3.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true

  assets:
    # Logo officiel Google « G » (4 couleurs) — règles de marque Google.
    - assets/images/google_g_logo.svg
