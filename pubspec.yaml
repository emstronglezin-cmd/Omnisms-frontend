name: omnisms
description: OmniSMS - Application de messagerie SMS complète
publish_to: 'none'
version: 2.5.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Network
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Storage
  shared_preferences: ^2.3.2

  # Audio (web-compatible)
  just_audio: ^0.9.36

  # Performance & Cache
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
