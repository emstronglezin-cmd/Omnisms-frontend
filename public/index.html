<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OmniSMS">
  <meta name="description" content="OmniSMS - Messagerie SMS sécurisée et professionnelle">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/Icon-192.png">
  <link rel="apple-touch-icon" href="/icons/Icon-192.png">
  <title>OmniSMS</title>
  <link rel="stylesheet" href="/style.css?v=3.3.0">
</head>
<body>

<!-- ════════════════════ SPLASH ════════════════════ -->
<div id="screen-splash" class="screen active">
  <div class="splash-logo">
    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9H7V9h10v2zm-4 4H7v-2h6v2zm4-8H7V5h10v2z"/></svg>
  </div>
  <div class="splash-title">OmniSMS</div>
  <div class="splash-sub">Messagerie intelligente</div>
  <div class="splash-spinner"><div class="spinner"></div></div>
</div>

<!-- ════════════════════ LOGIN ════════════════════ -->
<div id="screen-login" class="screen">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9H7V9h10v2zm-4 4H7v-2h6v2zm4-8H7V5h10v2z"/></svg>
    </div>
    <div class="auth-title">OmniSMS</div>
    <div class="auth-sub">Messagerie Sécurisée</div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Téléphone ou Email</label>
        <input id="login-identifier" type="text" class="form-input" placeholder="+22670123456 ou votre@email.com" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input id="login-pass" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div id="login-error" class="field-error"></div>
      <div style="margin-top:20px">
        <button id="login-btn" type="submit" class="btn-primary">Se connecter</button>
      </div>
    </form>

    <div class="form-divider" style="margin-top:20px">ou</div>
    <button class="btn-text" onclick="showScreen('screen-register')">Pas de compte ? S'inscrire</button>
    <button class="btn-text" style="color:var(--text-secondary);font-size:13px"
      onclick="State.token=null; State.user={name:'Visiteur',email:'demo@omnisms.app',id:'demo'}; initDashboard()">
      Continuer sans compte
    </button>
  </div>
</div>

<!-- ════════════════════ REGISTER ════════════════════ -->
<div id="screen-register" class="screen">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9H7V9h10v2zm-4 4H7v-2h6v2zm4-8H7V5h10v2z"/></svg>
    </div>
    <div class="auth-title">Créer un compte</div>
    <div class="auth-sub">Rejoignez OmniSMS</div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label">Nom complet <span style="color:var(--accent)">*</span></label>
        <input id="reg-name" type="text" class="form-input" placeholder="Jean Dupont" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Nom d'utilisateur <span style="color:var(--text-muted);font-size:12px">(optionnel)</span></label>
        <input id="reg-username" type="text" class="form-input" placeholder="@monpseudo" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Téléphone <span style="color:var(--accent)">*</span></label>
        <input id="reg-phone" type="tel" class="form-input" placeholder="+22670123456" autocomplete="tel" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email <span style="color:var(--text-muted);font-size:12px">(optionnel)</span></label>
        <input id="reg-email" type="email" class="form-input" placeholder="votre@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe <span style="color:var(--accent)">*</span></label>
        <input id="reg-pass" type="password" class="form-input" placeholder="••••••••" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmer le mot de passe <span style="color:var(--accent)">*</span></label>
        <input id="reg-pass-confirm" type="password" class="form-input" placeholder="••••••••" minlength="8" autocomplete="new-password" required>
      </div>
      <div id="register-error" class="field-error"></div>
      <div style="margin-top:20px">
        <button id="register-btn" type="submit" class="btn-primary">S'inscrire</button>
      </div>
    </form>

    <div class="form-divider" style="margin-top:16px"></div>
    <button class="btn-text" onclick="showScreen('screen-login')">Déjà un compte ? Se connecter</button>
  </div>
</div>

<!-- ════════════════════ DASHBOARD v3 ════════════════════ -->
<div id="screen-dashboard" class="screen">

  <!-- ── Top Bar ── -->
  <div class="topbar">
    <div class="topbar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </div>
      <span class="topbar-name">OmniSMS</span>
    </div>
    <div class="topbar-actions">
      <div class="online-dot" title="En ligne"></div>
      <button class="avatar-btn" id="user-avatar" onclick="switchTab('settings')">U</button>
    </div>
  </div>

  <!-- ── Tab Content Area ── -->
  <div class="tab-content-area">

    <!-- ─── TAB : Messages ─── -->
    <div id="tab-messages" class="tab-pane active">
      <div class="tab-header">
        <h2>Messages</h2>
        <button class="icon-btn" title="Nouveau message" onclick="switchTab('contacts')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        </button>
      </div>
      <div id="conv-list" class="list-area"></div>
    </div>

    <!-- ─── TAB : Contacts ─── -->
    <div id="tab-contacts" class="tab-pane">
      <div class="tab-header">
        <h2>Contacts</h2>
        <button class="icon-btn" title="Importer contacts" onclick="importWithContactPicker()" style="margin-right:4px">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
        </button>
        <button class="icon-btn" title="Ajouter contact" onclick="openModal('modal-add-contact')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        </button>
      </div>
      <div class="search-bar">
        <input id="contact-search" type="search" class="search-input" placeholder="Rechercher un contact...">
      </div>
      <div id="contacts-list" class="list-area"></div>
    </div>

    <!-- ─── TAB : Groupes ─── -->
    <div id="tab-groups" class="tab-pane">
      <div class="tab-header">
        <h2>Groupes</h2>
        <button class="icon-btn" title="Créer un groupe" onclick="openCreateGroupModal()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        </button>
      </div>
      <div id="groups-list" class="list-area"></div>
    </div>

    <!-- ─── TAB : Paramètres ─── -->
    <div id="tab-settings" class="tab-pane">
      <div class="tab-header"><h2>Paramètres</h2></div>
      <div id="settings-content" class="settings-list"></div>
    </div>

  </div><!-- /tab-content-area -->

  <!-- ── Bottom Navigation Bar ── -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="messages" onclick="switchTab('messages')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9H7V9h10v2zm-4 4H7v-2h6v2zm4-8H7V5h10v2z"/></svg>
      <span>Messages</span>
    </button>
    <button class="nav-btn" data-tab="contacts" onclick="switchTab('contacts')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>Contacts</span>
    </button>
    <button class="nav-btn" data-tab="groups" onclick="switchTab('groups')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      <span>Groupes</span>
    </button>
    <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      <span>Paramètres</span>
    </button>
  </nav>

</div><!-- /screen-dashboard -->

<!-- ════════════════════ CONVERSATION SCREEN ════════════════════ -->
<div id="screen-conversation" class="screen">
  <!-- App Bar -->
  <div class="conv-appbar">
    <button class="back-btn" id="conv-screen-back" onclick="closeConversation()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="conv-appbar-info">
      <div class="conv-appbar-name" id="conv-screen-name">Conversation</div>
      <div class="conv-appbar-sub" id="conv-screen-sub"></div>
    </div>
    <button class="icon-btn" onclick="loadActiveConvMessages()" title="Actualiser">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <!-- Messages List -->
  <div id="conv-messages" class="conv-messages-area"></div>

  <!-- Input Bar avec micro -->
  <div class="conv-input-bar">
    <button id="mic-btn" class="mic-btn" onclick="startRecording()" title="Message vocal">🎤</button>
    <span id="recording-timer" style="display:none;color:var(--accent);font-size:13px;min-width:36px">0:00</span>
    <textarea id="conv-msg-input" class="conv-input" placeholder="Message..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
    <button class="send-btn" onclick="sendMessage()" title="Envoyer">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- ════════════════════ MODALS ════════════════════ -->

<!-- Ajouter un contact -->
<div id="modal-add-contact" class="modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-title">Ajouter un contact</span>
      <button class="modal-close" onclick="closeModal('modal-add-contact')">✕</button>
    </div>

    <!-- Import buttons -->
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button type="button" class="btn-ghost" style="flex:1;font-size:13px" onclick="importWithContactPicker()">
        📱 Importer (téléphone)
      </button>
      <label style="flex:1;font-size:13px;cursor:pointer;text-align:center;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);color:var(--text-primary);display:flex;align-items:center;justify-content:center;gap:6px">
        📂 Importer VCF
        <input id="vcf-import-input" type="file" accept=".vcf,text/vcard" style="display:none">
      </label>
    </div>
    <div style="text-align:center;color:var(--text-muted);font-size:12px;margin-bottom:16px">— ou ajouter manuellement —</div>

    <form id="add-contact-form">
      <div class="form-group">
        <label class="form-label">Nom</label>
        <input id="contact-name" type="text" class="form-input" placeholder="Jean Dupont" required>
      </div>
      <div class="form-group">
        <label class="form-label">Téléphone (format international)</label>
        <input id="contact-phone" type="tel" class="form-input" placeholder="+22670123456" required>
      </div>
      <div id="contact-error" class="field-error"></div>
      <div style="margin-top:20px;display:flex;gap:12px">
        <button type="button" class="btn-ghost" style="flex:1" onclick="closeModal('modal-add-contact')">Annuler</button>
        <button id="add-contact-btn" type="submit" class="btn-primary" style="flex:2">Ajouter</button>
      </div>
    </form>
  </div>
</div>

<!-- Créer un groupe -->
<div id="modal-create-group" class="modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-title">Créer un groupe</span>
      <button class="modal-close" onclick="closeModal('modal-create-group')">✕</button>
    </div>
    <form id="create-group-form">
      <div class="form-group">
        <label class="form-label">Nom du groupe</label>
        <input id="group-name" type="text" class="form-input" placeholder="Mon groupe" required>
      </div>
      <div class="form-group">
        <label class="form-label">Description (optionnel)</label>
        <input id="group-desc" type="text" class="form-input" placeholder="Description...">
      </div>
      <div class="form-group">
        <label class="form-label">Membres</label>
        <div id="group-member-list" style="max-height:200px;overflow-y:auto;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:8px">
          <p class="text-muted" style="text-align:center;margin:8px 0">Chargement des contacts...</p>
        </div>
      </div>
      <div style="margin-top:20px;display:flex;gap:12px">
        <button type="button" class="btn-ghost" style="flex:1" onclick="closeModal('modal-create-group')">Annuler</button>
        <button id="create-group-btn" type="submit" class="btn-primary" style="flex:2">Créer</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ════════════════════ MODAL EDIT GROUPE ════════════════════ -->
<div id="modal-edit-group" class="modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-title">Modifier le groupe</span>
      <button class="modal-close" onclick="closeModal('modal-edit-group')">✕</button>
    </div>
    <form id="edit-group-form">
      <input id="edit-group-id" type="hidden">
      <div class="form-group">
        <label class="form-label">Nom du groupe</label>
        <input id="edit-group-name" type="text" class="form-input" placeholder="Nom du groupe" required>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <input id="edit-group-desc" type="text" class="form-input" placeholder="Description (optionnel)">
      </div>
      <div class="form-group">
        <label class="form-label">URL Image / Icône</label>
        <input id="edit-group-image" type="url" class="form-input" placeholder="https://...">
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button type="button" class="btn-ghost" style="flex:1" onclick="closeModal('modal-edit-group')">Annuler</button>
        <button type="submit" class="btn-primary" style="flex:2">✅ Mettre à jour</button>
      </div>
    </form>
  </div>
</div>

<script>
// ── Gestion des formulaires ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Login form
  const lf = document.getElementById('login-form');
  if (lf) lf.addEventListener('submit', e => {
    e.preventDefault();
    login(
      document.getElementById('login-identifier').value.trim(),
      document.getElementById('login-pass').value
    );
  });

  // Register form
  const rf = document.getElementById('register-form');
  if (rf) rf.addEventListener('submit', e => {
    e.preventDefault();
    const pass    = document.getElementById('reg-pass').value;
    const confirm = document.getElementById('reg-pass-confirm').value;
    if (pass !== confirm) {
      document.getElementById('register-error').textContent = 'Les mots de passe ne correspondent pas.';
      document.getElementById('register-error').style.display = 'block';
      return;
    }
    register(
      document.getElementById('reg-name').value,
      document.getElementById('reg-phone').value,
      document.getElementById('reg-email').value,
      pass
    );
  });

  // Add contact form
  const acf = document.getElementById('add-contact-form');
  if (acf) acf.addEventListener('submit', e => {
    e.preventDefault();
    addContact(document.getElementById('contact-name').value, document.getElementById('contact-phone').value);
  });

  // Create group form
  const cgf = document.getElementById('create-group-form');
  if (cgf) cgf.addEventListener('submit', e => {
    e.preventDefault();
    createGroup(document.getElementById('group-name').value, document.getElementById('group-desc').value);
  });

  // VCF import
  const vcf = document.getElementById('vcf-import-input');
  if (vcf) vcf.addEventListener('change', e => { if (e.target.files[0]) handleVCFFile(e.target.files[0]); });

  // Contact search
  const cs = document.getElementById('contact-search');
  if (cs) cs.addEventListener('input', e => searchContacts(e.target.value));

  // Edit group form
  const egf = document.getElementById('edit-group-form');
  if (egf) egf.addEventListener('submit', e => {
    e.preventDefault();
    saveGroupEdits();
  });
});
</script>

<script src="/app.js?v=3.3.0"></script>
</body>
</html>
