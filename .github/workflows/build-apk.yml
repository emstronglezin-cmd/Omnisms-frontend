name: Omnisms Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      # 📥 Code
      - name: Checkout
        uses: actions/checkout@v4

      # ☕ Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ⚡ Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # 🚀 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 📦 Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🧹 Clean (IMPORTANT)
      - name: Clean project
        run: |
          flutter clean
          cd android
          ./gradlew clean
          cd ..

      # 🔐 Permissions Gradle
      - name: Fix Gradle permissions
        run: chmod +x android/gradlew

      # 🏗 Build APK
      - name: Build APK
        run: flutter build apk --release

      # 🏗 Build AAB (Play Store)
      - name: Build AAB
        run: flutter build appbundle --release

      # 📤 Upload artifacts
      - name: Upload APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: omnisms-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab