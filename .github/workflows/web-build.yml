name: 🌐 Build and Deploy Flutter Web

on:
  push:
    branches:
      - main
      - feature/complete-backend-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
          
      - name: 📦 Install dependencies
        run: flutter pub get
        
      - name: 🔍 Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true
        
      - name: 🏗️ Build Web (Release)
        run: |
          flutter build web \
            --release \
            --web-renderer canvaskit \
            --base-href "/" \
            --pwa-strategy offline-first
            
      - name: 📊 Display build info
        run: |
          echo "Build completed successfully!"
          du -sh build/web
          ls -lh build/web
          
      - name: 📤 Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: build/web/
          retention-days: 30
          
      - name: 📝 Create Build Summary
        run: |
          echo "## 🎉 Web Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Size:** $(du -sh build/web | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Web build available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy to Firebase: \`firebase deploy --only hosting\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Or serve locally: \`cd build/web && python3 -m http.server 8000\`" >> $GITHUB_STEP_SUMMARY

  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: build/web/
          
      - name: 🔥 Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: omnisms-b98c5
          channelId: live
          
      - name: 📝 Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** https://omnisms-b98c5.web.app" >> $GITHUB_STEP_SUMMARY
          echo "**Alt URL:** https://omnisms-b98c5.firebaseapp.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Checklist" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Web build completed" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Deployed to Firebase Hosting" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Test PWA installation" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Verify offline mode" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Check responsive design" >> $GITHUB_STEP_SUMMARY
