<!DOCTYPE html>

<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SÉCURITÉ : Content-Security-Policy — limite l'impact d'un XSS
       (le token JWT est stocké dans localStorage côté web).
       NB : une CSP complète doit aussi être posée en en-tête HTTP
       (vercel.json / firebase.json). -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' blob:;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https:;
    media-src 'self' blob: https://omnisms-backend.onrender.com;
    font-src 'self' data: https://fonts.gstatic.com;
    connect-src 'self'
      https://omnisms-backend.onrender.com
      wss://omnisms-backend.onrender.com
      https://*.googleapis.com
      https://apis.google.com
      https://firebaseinstallations.googleapis.com
      https://firebasestorage.googleapis.com;
    base-uri 'self';
    form-action 'self';
    object-src 'none';
  ">
  <meta name="description" content="OmniSMS - Application de messagerie SMS sécurisée et moderne avec gestion de contacts et groupes">
  <meta name="keywords" content="SMS, messagerie, contacts, groupes, OmniSMS">
  <meta name="author" content="OmniSMS Team">

  <!-- iOS meta tags & icons -->

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OmniSMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Android Chrome -->

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080c14">

  <!-- PWA -->

  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Open Graph / Facebook -->

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://omnisms.web.app">
  <meta property="og:title" content="OmniSMS - Messagerie SMS Professionnelle">
  <meta property="og:description" content="Application de messagerie SMS sécurisée et moderne avec gestion de contacts et groupes">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter -->

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://omnisms.web.app">
  <meta property="twitter:title" content="OmniSMS - Messagerie SMS Professionnelle">
  <meta property="twitter:description" content="Application de messagerie SMS sécurisée et moderne avec gestion de contacts et groupes">
  <meta property="twitter:image" content="icons/Icon-512.png">

  <!-- Viewport -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>OmniSMS</title>

  <style>
    /* Loading splash screen */
    body {
      margin: 0;
      padding: 0;
      background-color: #080c14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #080c14 0%, #0f1520 100%);
      z-index: 9999;
    }

    #loading-logo {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #00d4ff 0%, #0066ff 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulse 2s infinite;
      box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
    }

    #loading-logo svg {
      width: 64px;
      height: 64px;
      fill: white;
    }

    #loading-text {
      color: #e8edf5;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    #loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 212, 255, 0.1);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    #install-prompt {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #00d4ff 0%, #0066ff 100%);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
      z-index: 1000;
      animation: slideUp 0.3s ease-out;
      max-width: 90%;
    }

    @keyframes slideUp {
      from {
        transform: translateX(-50%) translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    #install-prompt button {
      background: white;
      color: #0066ff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      margin-left: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    #install-prompt button:hover {
      background: #f0f0f0;
    }

    /* ── Mobile browser interaction fixes ─────────────────────
       Fixes: Safari zoom on tap, pointer-events blocking, touch-action issues
       These only affect the pre-Flutter splash / install prompt layer.
       The installed PWA is unaffected (Flutter handles its own rendering).
    ─────────────────────────────────────────────────────────── */

    /* Prevent Safari iOS double-tap zoom on buttons */
    button, [role="button"] {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Ensure install-prompt buttons are always tappable */
    #install-prompt button {
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      pointer-events: auto;
      min-height: 44px;   /* iOS HIG minimum tap target */
      min-width: 44px;
    }

    /* Safari iOS: prevent overflow that can block touch events */
    #install-prompt {
      -webkit-overflow-scrolling: touch;
      pointer-events: auto;
    }

    /* iOS instruction modal */
    #ios-install-modal {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a2235;
      color: #e8edf5;
      padding: 24px 20px 40px;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.5);
      z-index: 10000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      animation: slideUpModal 0.3s ease-out;
    }

    @keyframes slideUpModal {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    #ios-install-modal h3 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 700;
      color: #00d4ff;
    }

    #ios-install-modal p {
      margin: 8px 0;
      font-size: 15px;
      line-height: 1.5;
      color: #c8d8e8;
    }

    #ios-install-modal .step {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }

    #ios-install-modal .step-icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    #ios-close-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #00d4ff;
      color: #080c14;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .offline-indicator {
      display: none;
      position: fixed;
      top: 16px;
      right: 16px;
      background: #ff4444;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1001;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>

</head>
<body>
  <!-- Loading splash screen -->
  <div id="loading">
    <div id="loading-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 11H7V9h2v2zm4 0h-2V9h2v2zm4 0h-2V9h2v2z"/>
      </svg>
    </div>
    <div id="loading-text">OmniSMS</div>
    <div id="loading-spinner"></div>
  </div>

  <!-- PWA install prompt -->

  <div id="install-prompt">
    <span>📱 Installer OmniSMS sur votre appareil</span>
    <button id="install-button">Installer</button>
    <button id="dismiss-button" style="background: transparent; color: white; border: 1px solid white;">Pas maintenant</button>
  </div>

  <!-- Offline indicator -->

  <div id="offline-indicator" class="offline-indicator">
    🔴 Mode hors ligne - Connexion limitée
  </div>

  <!-- CORRECTION 1 : flutter_bootstrap.js gère lui-même le loader moderne -->

  <script src="flutter_bootstrap.js"></script>

  <script>
    // CORRECTION 2 : on attend que flutter_bootstrap soit prêt avant d'initialiser
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loading').style.display = 'none';
    });

    // Fallback : si flutter-first-frame ne se déclenche pas après 8s, on cache le loading
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    }, 8000);

    // ── PWA Install Logic ──────────────────────────────────────────
    // Détecte la plateforme et adapte le comportement :
    //   Chrome Android      → beforeinstallprompt → prompt natif
    //   Android (autre)     → APK download (bouton "Installer" → télécharger APK)
    //   Safari iOS          → instructions "Ajouter à l'écran d'accueil"
    //   PWA déjà installée  → ne pas afficher le prompt
    // ──────────────────────────────────────────────────────────────

    // Détecter si déjà lancé en standalone (PWA installée)
    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    // Détecter iOS/Safari
    const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent);
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    const isIOSSafari = isIOS;

    // Détecter Android
    const isAndroid = /android/i.test(navigator.userAgent);
    const isChrome = /chrome/i.test(navigator.userAgent) && !/edge/i.test(navigator.userAgent);

    // URL de l'APK Android (à remplacer par l'URL réelle après build)
    const APK_DOWNLOAD_URL = 'https://omnisms-backend.onrender.com/api/download/app-release.apk';

    let deferredPrompt = null;
    const installPrompt = document.getElementById('install-prompt');
    const installButton = document.getElementById('install-button');
    const dismissButton = document.getElementById('dismiss-button');

    // Afficher le prompt (sauf si déjà installé en standalone)
    function showInstallPrompt() {
      if (!isStandalone) {
        setTimeout(() => {
          if (installPrompt) installPrompt.style.display = 'block';
        }, 2500);
      }
    }

    // ── Chrome Android : beforeinstallprompt (installation native)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      showInstallPrompt();
    });

    // ── Action du bouton "Installer"
    if (installButton) {
      installButton.addEventListener('click', async (ev) => {
        // Empêcher zoom Safari sur double-tap
        ev.preventDefault();
        ev.stopPropagation();

        if (isStandalone) {
          // Déjà installé — ne rien faire
          if (installPrompt) installPrompt.style.display = 'none';
          return;
        }

        if (deferredPrompt) {
          // Chrome Android : utiliser le prompt natif
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('[OmniSMS] Install outcome:', outcome);
          deferredPrompt = null;
          if (installPrompt) installPrompt.style.display = 'none';

        } else if (isIOSSafari) {
          // Safari iOS : afficher les instructions add-to-homescreen
          if (installPrompt) installPrompt.style.display = 'none';
          showIOSInstructions();

        } else if (isAndroid) {
          // Android sans beforeinstallprompt (navigateur autre que Chrome)
          // → Proposer le téléchargement de l'APK
          if (installPrompt) installPrompt.style.display = 'none';
          downloadAPK();

        } else {
          // Autre navigateur : tenter d'ouvrir le guide
          if (installPrompt) installPrompt.style.display = 'none';
          showGenericInstallGuide();
        }
      }, { passive: false });
    }

    // ── Bouton "Pas maintenant"
    if (dismissButton) {
      dismissButton.addEventListener('click', (ev) => {
        ev.preventDefault();
        if (installPrompt) installPrompt.style.display = 'none';
      }, { passive: false });
    }

    // ── Afficher les instructions iOS Safari ───────────────────
    function showIOSInstructions() {
      // Créer la modal si elle n'existe pas
      if (!document.getElementById('ios-install-modal')) {
        const modal = document.createElement('div');
        modal.id = 'ios-install-modal';
        modal.innerHTML = `
          <h3>📱 Installer OmniSMS</h3>
          <p>Pour ajouter OmniSMS sur votre écran d'accueil :</p>
          <div class="step">
            <span class="step-icon">1️⃣</span>
            <span>Appuyez sur le bouton <strong>Partager</strong> <span style="font-size:18px">⬆️</span> en bas de Safari</span>
          </div>
          <div class="step">
            <span class="step-icon">2️⃣</span>
            <span>Faites défiler et appuyez sur <strong>"Sur l'écran d'accueil"</strong></span>
          </div>
          <div class="step">
            <span class="step-icon">3️⃣</span>
            <span>Appuyez sur <strong>"Ajouter"</strong> en haut à droite</span>
          </div>
          <button id="ios-close-btn" onclick="document.getElementById('ios-install-modal').style.display='none'">
            Compris !
          </button>
        `;
        document.body.appendChild(modal);
      }
      document.getElementById('ios-install-modal').style.display = 'block';
    }

    // ── Télécharger l'APK Android ──────────────────────────────
    function downloadAPK() {
      const a = document.createElement('a');
      a.href = APK_DOWNLOAD_URL;
      a.download = 'OmniSMS.apk';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      console.log('[OmniSMS] APK download triggered');
    }

    // ── Guide générique (autres navigateurs) ──────────────────
    function showGenericInstallGuide() {
      alert('Pour installer OmniSMS :\n\nChrome Android : Menu (⋮) → "Ajouter à l\'écran d\'accueil"\niPhone Safari : Bouton Partager → "Sur l\'écran d\'accueil"');
    }

    // ── Déclencher l'affichage selon la plateforme ─────────────
    if (!isStandalone) {
      if (isIOSSafari) {
        // iOS Safari : pas de beforeinstallprompt → montrer le bouton Installer
        showInstallPrompt();
      }
      // Android Chrome : showInstallPrompt() est appelé dans beforeinstallprompt
      // Android autre  : pas de prompt automatique, bouton visible à la demande
    }

    // ── Détection offline/online ───────────────────────────────
    const offlineIndicator = document.getElementById('offline-indicator');

    window.addEventListener('online', () => {
      if (offlineIndicator) offlineIndicator.style.display = 'none';
    });

    window.addEventListener('offline', () => {
      if (offlineIndicator) offlineIndicator.style.display = 'block';
    });

    if (!navigator.onLine && offlineIndicator) {
      offlineIndicator.style.display = 'block';
    }
  </script>

</body>
</html>
