<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- 
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OmniSMS - Application de messagerie SMS sécurisée et moderne avec gestion de contacts et groupes">
  <meta name="keywords" content="SMS, messagerie, contacts, groupes, OmniSMS">
  <meta name="author" content="OmniSMS Team">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OmniSMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Android Chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080c14">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://omnisms.web.app">
  <meta property="og:title" content="OmniSMS - Messagerie SMS Professionnelle">
  <meta property="og:description" content="Application de messagerie SMS sécurisée et moderne avec gestion de contacts et groupes">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://omnisms.web.app">
  <meta property="twitter:title" content="OmniSMS - Messagerie SMS Professionnelle">
  <meta property="twitter:description" content="Application de messagerie SMS sécurisée et moderne avec gestion de contacts et groupes">
  <meta property="twitter:image" content="icons/Icon-512.png">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>OmniSMS</title>
  
  <style>
    /* Loading splash screen */
    body {
      margin: 0;
      padding: 0;
      background-color: #080c14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #080c14 0%, #0f1520 100%);
      z-index: 9999;
    }

    #loading-logo {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #00d4ff 0%, #0066ff 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulse 2s infinite;
      box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
    }

    #loading-logo svg {
      width: 64px;
      height: 64px;
      fill: white;
    }

    #loading-text {
      color: #e8edf5;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    #loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 212, 255, 0.1);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    #install-prompt {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #00d4ff 0%, #0066ff 100%);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
      z-index: 1000;
      animation: slideUp 0.3s ease-out;
      max-width: 90%;
    }

    @keyframes slideUp {
      from {
        transform: translateX(-50%) translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    #install-prompt button {
      background: white;
      color: #0066ff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      margin-left: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    #install-prompt button:hover {
      background: #f0f0f0;
    }

    .offline-indicator {
      display: none;
      position: fixed;
      top: 16px;
      right: 16px;
      background: #ff4444;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1001;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <!-- Loading splash screen -->
  <div id="loading">
    <div id="loading-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 11H7V9h2v2zm4 0h-2V9h2v2zm4 0h-2V9h2v2z"/>
      </svg>
    </div>
    <div id="loading-text">OmniSMS</div>
    <div id="loading-spinner"></div>
  </div>

  <!-- PWA install prompt -->
  <div id="install-prompt">
    <span>📱 Installer OmniSMS sur votre appareil</span>
    <button id="install-button">Installer</button>
    <button id="dismiss-button" style="background: transparent; color: white; border: 1px solid white;">Pas maintenant</button>
  </div>

  <!-- Offline indicator -->
  <div id="offline-indicator" class="offline-indicator">
    🔴 Mode hors ligne - Connexion limitée
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            // Hide loading screen when Flutter is ready
            document.getElementById('loading').style.display = 'none';
            appRunner.runApp();
          });
        }
      });

      // PWA install prompt
      let deferredPrompt;
      const installPrompt = document.getElementById('install-prompt');
      const installButton = document.getElementById('install-button');
      const dismissButton = document.getElementById('dismiss-button');

      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent the mini-infobar from appearing on mobile
        e.preventDefault();
        // Stash the event so it can be triggered later
        deferredPrompt = e;
        // Show install prompt after 3 seconds
        setTimeout(() => {
          installPrompt.style.display = 'block';
        }, 3000);
      });

      installButton.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`User response to the install prompt: ${outcome}`);
          deferredPrompt = null;
          installPrompt.style.display = 'none';
        }
      });

      dismissButton.addEventListener('click', () => {
        installPrompt.style.display = 'none';
      });

      // Offline/online detection
      const offlineIndicator = document.getElementById('offline-indicator');
      
      window.addEventListener('online', () => {
        offlineIndicator.style.display = 'none';
      });

      window.addEventListener('offline', () => {
        offlineIndicator.style.display = 'block';
      });

      // Check initial connection status
      if (!navigator.onLine) {
        offlineIndicator.style.display = 'block';
      }
    });

    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('flutter_service_worker.js?v='+new Date().getTime())
          .then(function(registration) {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(function(error) {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
